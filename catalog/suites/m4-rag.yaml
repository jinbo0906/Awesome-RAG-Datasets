id: m4-rag
name: M4-RAG
entity_type: suite
status: source_checked
summary: Multilingual and multicultural retrieval-augmented VQA over CVQA and WorldCuisines with separate Wikipedia source pools.
summary_zh: 基于 CVQA、WorldCuisines 及独立维基百科语料池的多语言、多文化检索增强视觉问答套件。
components: []
protocol: >-
  The CVPR 2026 paper introduces a RAG evaluation protocol over CVQA and WorldCuisines, reporting
  more than 80,000 image-question pairs across 42 languages, 56 dialects/registers and 189 countries.
  These converted components are not separately indexed in this catalog. Obtain QA/images from the
  two upstream datasets, not from the M4-RAG corpus-only Hugging Face repository. Its current metadata
  lists 306,794 CVQA-domain and 223,468 WorldCuisines-domain Wikipedia article records; the split named
  train is a source-corpus split, not supervised QA training. Use the separate evaluation scripts and
  specified multiple-choice/open-ended answer scoring, reporting language, prompt, retrieval and
  oracle-caption conditions. Answer-string containment in retrieved chunks is a diagnostic, not
  independently annotated evidence qrels. The corpus card specifies CC-BY-SA-4.0; QA, images and
  code retain separate terms. Do not equate this suite with newly created native QA or exhaustive
  cross-language relevance judgments.
