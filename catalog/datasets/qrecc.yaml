id: qrecc
name: QReCC
entity_type: dataset
status: source_checked
last_checked: '2026-10-02'
summary: Open-domain conversational QA with human question rewrites, answers and source URLs over a released web collection.
classification: {rag_role: rag_native, primary_category: text_rag, tasks: [conversational_qa, query_rewriting, evidence_retrieval], modalities: [text], domains: [web], languages: [en]}
data:
  corpus: provided
  queries: provided
  answers: provided
  description: Conversations extend QuAC, TREC CAsT and Natural Questions. Each turn includes context, a standalone rewrite, an answer and its source URL; the collection contains about 10M web pages segmented into 54M passages.
  size: Approximately 14K conversations and 81K question-answer pairs.
ground_truth:
  levels: [document, answer]
  provenance: human
  description: Human rewrites and answers are linked to source web pages. The original retrieval evaluator can determine passage relevance through answer-overlap thresholds; this should not be described as exhaustive human passage relevance annotation.
  alternatives: not_documented
evaluation:
  official_metrics: [MRR, Recall@k, exact_match, token_f1]
  protocol: Preserve dialogue order and distinguish gold rewrites from predicted rewrites. Report the original retrieval answer-overlap threshold or the provenance of replacement qrels, and score answer quality separately.
  evaluator: 'https://github.com/apple-aiml-research/ml-qrecc/tree/main/utils'
access: {official: 'https://github.com/apple-aiml-research/ml-qrecc', paper: 'https://aclanthology.org/2021.naacl-main.44/', license: CC-BY-SA-3.0}
use:
  best_for: [Context-dependent question rewriting, Retrieval and answer errors across dialogue turns]
  caveats: [Source URLs do not establish complete passage-level relevance, Gold-rewrite retrieval and end-to-end conversational QA are different settings]
sources:
  - {url: 'https://github.com/apple-aiml-research/ml-qrecc', type: repository, fields: [summary, data.description, data.size, ground_truth.description, access.license], checked_on: '2026-10-02'}
  - {url: 'https://github.com/apple-aiml-research/ml-qrecc/blob/main/utils/evaluate_retrieval.py', type: repository, fields: [evaluation.official_metrics, evaluation.protocol], checked_on: '2026-10-02'}
  - {url: 'https://github.com/apple-aiml-research/ml-qrecc/blob/main/utils/evaluate_qa.py', type: repository, fields: [evaluation.official_metrics], checked_on: '2026-10-02'}
