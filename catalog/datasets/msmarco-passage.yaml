id: msmarco-passage
name: MS MARCO Passage Ranking (v1)
entity_type: dataset
status: source_checked
last_checked: '2026-09-28'
summary: Large-scale web passage retrieval with query-passage relevance judgments.
classification:
  rag_role: auxiliary
  primary_category: text_rag
  tasks: [evidence_retrieval]
  modalities: [text]
  domains: [web]
  languages: [en]
data:
  corpus: provided
  queries: provided
  answers: not_provided
  description: >-
    This record covers the passage-ranking v1 variant, not the original MS MARCO generative QA
    task, document ranking or TREC Deep Learning track. The v1 collection has about 8.8 million
    passages, queries and sparse qrels.
ground_truth:
  levels: [document]
  provenance: human
  description: >-
    Qrels identify relevant passages for ranking. They do not provide a complete set of all
    relevant passages or a reference generated answer in this ranking variant.
  alternatives: implicit
evaluation:
  official_metrics: [mrr_at_10]
  protocol: >-
    State v1 versus v2, train/dev/test split and full-retrieval versus reranking setting.
    Sparse judgments require caution when treating unjudged passages as negatives.
access:
  official: 'https://microsoft.github.io/msmarco/'
  license: unknown
use:
  best_for: [Retriever training and ranking controls, Large-scale passage indexing]
  caveats: [Retrieval-only variant is not an end-to-end answer benchmark, Sparse qrels can undercount relevant evidence]
sources:
  - {url: 'https://github.com/microsoft/msmarco/blob/master/Datasets.md', type: repository, fields: [summary, data.description, ground_truth.description, evaluation.protocol], checked_on: '2026-09-28'}
  - {url: 'https://github.com/microsoft/MSMARCO-Passage-Ranking', type: repository, fields: [evaluation.official_metrics], checked_on: '2026-09-28'}
