id: enterpriserag-bench
name: EnterpriseRAG-Bench
entity_type: dataset
status: source_checked
last_checked: '2026-11-01'
summary: Synthetic company-internal retrieval and QA with dense distractors, conflicting records, completeness queries and absent information.
classification: {rag_role: rag_native, primary_category: text_rag, tasks: [multi_hop_qa, evidence_retrieval, rag_robustness], modalities: [text], domains: [enterprise], languages: [en]}
data:
  corpus: provided
  queries: provided
  answers: provided
  description: Public arXiv release dated 2026-05-05, simulating one company across nine source types such as Slack, email, tickets and wikis. The author dataset card supplies questions, expected_doc_ids, gold_answer and answer_facts; documents are provided separately. This is synthetic enterprise data, not a disclosure of real internal communications.
  size: More than 500,000 documents and 500 core questions in ten categories; another 100 metadata-dependent questions are excluded from the core leaderboard.
  splits: HF questions/test and documents/test are two configurations, not disjoint training/test corpora; freeze the specific release and gold set.
  format: HF Parquet configurations, JSONL questions and released document archives.
ground_truth:
  levels: [document, answer]
  provenance: synthetic
  description: LLM-generated questions, answers, atomic facts and pooled document IDs follow human-in-the-loop corpus scaffolding. High-Level and Info-Not-Found categories have no gold document IDs. Authors treat other gold sets as revisable, not exhaustive human qrels or fact-to-source citation mappings.
  alternatives: not_documented
evaluation:
  official_metrics: [Overall_Score, Answer_Correctness, Answer_Completeness, Document_Recall, Invalid_Extra_Docs]
  evaluator: 'https://github.com/onyx-dot-app/EnterpriseRAG-Bench/tree/main/answer_evaluation'
  protocol: Submit question_id, answer and document_ids. Overall Score averages per-question binary correctness times completeness; invalid extra documents is lower-is-better. Preserve no-answer/high-level handling, judge model and whether corrections were applied. Do not compare corrected gold with the initial leaderboard gold as one fixed test; report each release separately.
access:
  official: 'https://github.com/onyx-dot-app/EnterpriseRAG-Bench'
  paper: 'https://arxiv.org/abs/2605.05253'
  data: 'https://huggingface.co/datasets/onyx-dot-app/EnterpriseRAG-Bench'
  license: MIT (HF dataset card); record the corpus release separately from the code version.
use:
  best_for: [Testing coherent cross-document retrieval in noisy enterprise sources, Studying missing information and gold-set incompleteness at corpus scale]
  caveats: [Synthetic realism is not validation on private production data, Atomic answer facts are not minimal source spans, Gold corrections and judge changes affect score comparability]
sources:
  - {url: 'https://arxiv.org/abs/2605.05253', type: paper, fields: [summary, data.description, data.size], checked_on: '2026-11-01'}
  - {url: 'https://huggingface.co/datasets/onyx-dot-app/EnterpriseRAG-Bench', type: dataset_card, fields: [data.splits, data.format, access.license, evaluation.official_metrics, evaluation.protocol], checked_on: '2026-11-01'}
  - {url: 'https://github.com/onyx-dot-app/EnterpriseRAG-Bench', type: repository, fields: [data.size, ground_truth.description], checked_on: '2026-11-01'}
  - {url: 'https://arxiv.org/html/2605.05253', type: paper, fields: [ground_truth.provenance, ground_truth.description, evaluation.protocol], checked_on: '2026-11-01'}
  - {url: 'https://github.com/onyx-dot-app/EnterpriseRAG-Bench/blob/main/answer_evaluation/README.md', type: repository, fields: [evaluation.official_metrics, evaluation.protocol], checked_on: '2026-11-01'}
