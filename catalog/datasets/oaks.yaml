id: oaks
name: OAKS (Online Adaptation to Continual Knowledge Streams)
entity_type: dataset
status: source_checked
last_checked: '2026-11-18'
summary: Chronological streams with per-interval answers that expose how quickly a model adapts after a fact changes.
classification: {rag_role: auxiliary, primary_category: text_rag, tasks: [time_sensitive_qa, long_context_qa], modalities: [text], domains: [synthetic-narratives, novels], languages: [en]}
data:
  corpus: provided
  queries: provided
  answers: provided
  description: OAKS-B provides synthetic narratives with many state changes. OAKS-N uses public-domain novel passages and multiple-choice questions. Replay each stream in order and reveal chunks only as they arrive.
  size: 'Pinned public files: OAKS-B 12 streams, 1,224 question IDs and 78,994 question–interval labels. OAKS-N 19 novels, 435 question IDs and 32,403 labels. The paper describes 39 novels and 870 questions.'
  splits: Released OAKS-B streams and OAKS-N novels are separate conditions. Count repeated question IDs once when reporting unique questions.
  format: JSON with ordered chunks and question-to-answer maps indexed by chunk
ground_truth:
  levels: [sentence, answer]
  provenance: mixed
  description: chunk_to_answer supplies the expected answer at each stream interval. Novel records store full option texts and option_sources links options to supporting sentences by interval. Acquisition is scored by answer state.
  alternatives: not_documented
evaluation:
  official_metrics: [interval_accuracy, acquisition_latency_AL, distraction_susceptibility_DS, phase_miss_rate_PM]
  protocol: Score answers at each interval and macro-average by question. The paper separates errors before the first correct answer, errors after it and entirely missed phases. Record whether using the paper formula or the released script, which charges a wholly missed phase to latency. The RAG baseline filters precomputed neighbors to visible chunks.
  evaluator: https://github.com/kaistAI/OAKS/tree/c1a76e66b5b2276973ee8ee3de7063721e22a88f
access:
  official: https://github.com/adobe-research/OAKS
  data: https://github.com/adobe-research/OAKS/tree/0bbc4b3877eae5f9335f07c5e485aabf1d9136e9/data
  paper: https://aclanthology.org/2026.acl-long.1956/
  license: Adobe Research License (academic research or teaching and noncommercial use)
  gated: false
use:
  best_for: [Replaying repeated fact changes and measuring the time steps to recover the correct state, Comparing retrieval and online adaptation on the same chronological inputs]
  caveats: [Use the public novel subset denominator for released results, Answer intervals are states and the novel support metadata is separate, Report live index visibility delay separately if measuring it]
sources:
  - {url: 'https://aclanthology.org/2026.acl-long.1956.pdf', type: paper, fields: [summary, classification, data.description, ground_truth, evaluation.official_metrics, evaluation.protocol, use], checked_on: '2026-11-18'}
  - {url: 'https://github.com/adobe-research/OAKS/tree/0bbc4b3877eae5f9335f07c5e485aabf1d9136e9/data', type: repository, fields: [data.size, data.splits, data.format, ground_truth.description, access.data], checked_on: '2026-11-18'}
  - {url: 'https://github.com/adobe-research/OAKS/blob/0bbc4b3877eae5f9335f07c5e485aabf1d9136e9/LICENSE', type: repository, fields: [access.license], checked_on: '2026-11-18'}
