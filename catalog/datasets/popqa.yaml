id: popqa
name: PopQA
entity_type: dataset
status: source_checked
last_checked: '2026-10-02'
summary: Entity-centric factual questions with answer aliases, Wikidata identities and Wikipedia popularity metadata.
classification: {rag_role: rag_convertible, primary_category: text_rag, tasks: [single_hop_qa, evidence_retrieval], modalities: [text], domains: [wikipedia, wikidata], languages: [en]}
data:
  corpus: external
  queries: provided
  answers: provided
  description: Questions are constructed from entity relations; the release includes aliases and popularity metadata, while retrieval experiments use separately obtained passages or retrieval results.
  size: Approximately 14K QA pairs.
  splits: The author-hosted Hugging Face release has a test split; later training or long-tail subsets are separate experiment choices.
ground_truth:
  levels: [answer]
  provenance: distant
  description: Wikidata relations and object aliases define acceptable answers; entity IDs and page-view counts do not annotate supporting text passages.
  alternatives: explicit
evaluation:
  official_metrics: [answer_accuracy]
  protocol: The original code marks a generation correct when it contains an accepted answer alias with supported case variants; this is not strict normalized exact match. Report any popularity filter and external corpus snapshot.
  evaluator: 'https://github.com/AlexTMallen/adaptive-retrieval/blob/main/run_model.py'
access: {official: 'https://github.com/AlexTMallen/adaptive-retrieval', paper: 'https://aclanthology.org/2023.acl-long.546/', data: 'https://huggingface.co/datasets/akariasai/PopQA', license: unknown}
use:
  best_for: [Long-tail factual knowledge, Adaptive retrieval versus parametric answering]
  caveats: [Popularity-filtered subsets are not the complete dataset, No native passage relevance or supporting-span annotations are claimed]
sources:
  - {url: 'https://github.com/AlexTMallen/adaptive-retrieval', type: repository, fields: [summary, data.description, data.size, ground_truth.description], checked_on: '2026-10-02'}
  - {url: 'https://huggingface.co/datasets/akariasai/PopQA', type: dataset_card, fields: [data.splits, ground_truth.alternatives], checked_on: '2026-10-02'}
  - {url: 'https://github.com/AlexTMallen/adaptive-retrieval/blob/main/run_model.py', type: repository, fields: [evaluation.official_metrics, evaluation.protocol], checked_on: '2026-10-02'}
