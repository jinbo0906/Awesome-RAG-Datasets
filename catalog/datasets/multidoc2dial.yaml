id: multidoc2dial
name: MultiDoc2Dial
entity_type: dataset
status: source_checked
last_checked: '2026-10-02'
summary: Goal-oriented dialogues whose grounding documents change across turns, with retrieval and agent response generation tasks.
classification: {rag_role: rag_native, primary_category: text_rag, tasks: [conversational_qa, evidence_retrieval], modalities: [text], domains: [government, public-services], languages: [en]}
data:
  corpus: provided
  queries: provided
  answers: provided
  description: The release supplies documents and dialogues across four domains. Turn references contain document and span IDs, allowing the relevant document to change as the conversation moves between sub-goals.
  splits: The v1.0 data readme documents training and validation files and a dummy test file; shared-task releases need separate identification.
ground_truth:
  levels: [document, span, answer]
  provenance: human
  description: Human agent utterances are associated with grounding references containing doc_id and id_sp. Empty references cover specified unanswerable or irrelevant turns; precondition/solution labels are described as fuzzy annotations.
  alternatives: not_documented
evaluation:
  official_metrics: [document_Recall@k, passage_Recall@k, exact_match, token_f1, BLEU]
  protocol: Evaluate retrieval at document and passage levels separately from response generation; retain turn history and document/span mappings when changing segmentation.
access: {official: 'https://doc2dial.github.io/multidoc2dial/', paper: 'https://aclanthology.org/2021.emnlp-main.498/', data: 'https://github.com/IBM/multidoc2dial', license: unknown}
use:
  best_for: [Conversational retrieval with changing documents, Comparing document and passage evidence coverage]
  caveats: [A dummy test file is not a labeled evaluation set, Publisher-card license metadata and licensing prose disagree; confirm the applicable data license]
sources:
  - {url: 'https://doc2dial.github.io/multidoc2dial/', type: official, fields: [summary, data.description], checked_on: '2026-10-02'}
  - {url: 'https://doc2dial.github.io/multidoc2dial/data_readme.html', type: official, fields: [data.splits, ground_truth.description, ground_truth.levels], checked_on: '2026-10-02'}
  - {url: 'https://github.com/IBM/multidoc2dial', type: repository, fields: [evaluation.official_metrics, evaluation.protocol], checked_on: '2026-10-02'}
  - {url: 'https://huggingface.co/datasets/IBM/multidoc2dial', type: dataset_card, fields: [use.caveats], checked_on: '2026-10-02'}
