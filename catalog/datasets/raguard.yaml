id: raguard
name: RAGuard
entity_type: dataset
status: source_checked
last_checked: '2026-10-02'
summary: Political fact-checking benchmark testing RAG against naturally misleading Reddit retrievals.
classification: {rag_role: rag_native, primary_category: text_rag, tasks: [fact_verification, rag_robustness], modalities: [text], domains: [politics], languages: [en]}
data:
  corpus: provided
  queries: provided
  answers: provided
  description: Separate claims and documents CSVs contain binary verdicts, document IDs, Reddit text and supporting/misleading/unrelated labels.
  size: 2,648 claims and 16,331 documents.
  format: CSV
ground_truth: {levels: [document, answer], provenance: mixed, description: 'Verdicts derive from PolitiFact; document labels describe their effect on an annotating LLM, not universally true or false passages or minimal evidence.', alternatives: not_documented}
evaluation: {official_metrics: [accuracy], protocol: 'Compare zero-context, full-corpus RAG and oracle associated-document settings; distinguish RAG-1/RAG-5 and oracle-all/oracle-misleading. Invalid class outputs count as errors.'}
