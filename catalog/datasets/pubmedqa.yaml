id: pubmedqa
name: PubMedQA
entity_type: dataset
status: source_checked
last_checked: '2026-10-02'
summary: Biomedical research QA that predicts yes, no or maybe from a PubMed abstract, with labeled, unlabeled and artificial subsets.
classification: {rag_role: rag_convertible, primary_category: text_rag, tasks: [single_hop_qa, fact_verification], modalities: [text], domains: [biomedicine], languages: [en]}
data:
  corpus: provided
  queries: provided
  answers: provided
  description: Native examples supply a question, abstract context and conclusion-derived long answer. MIRAGE's PubMedQA* removes the given context from the 500 expert-labeled test questions and uses external retrieval instead.
  size: 1,000 expert-labeled, 61.2k unlabeled and 211.3k artificially generated instances; the unlabeled subset lacks gold decisions.
  format: JSON
ground_truth:
  levels: [answer]
  provenance: mixed
  description: Final yes/no/maybe decisions are the scored target, with expert labels in PQA-L and synthetic labels in PQA-A. The supplied abstract is task context, not an exhaustive open-corpus relevance judgment.
  alternatives: not_documented
evaluation:
  official_metrics: [accuracy, macro_f1]
  protocol: Report the selected subset and supervision regime. Native abstract-conditioned QA and MIRAGE's context-removed PubMedQA* evaluate different tasks; accuracy/F1 must not be treated as retrieval recall.
  evaluator: https://github.com/pubmedqa/pubmedqa/blob/master/evaluation.py
access: {official: 'https://pubmedqa.github.io/', paper: 'https://aclanthology.org/D19-1259/', data: 'https://github.com/pubmedqa/pubmedqa', license: 'unknown; PubMed abstract rights depend on upstream content'}
related_suites: [mirage]
use:
  best_for: [Biomedical abstract-conditioned QA, Context-removed medical RAG comparison via MIRAGE]
  caveats: [Source abstracts and reference conclusions must not leak into context-removed evaluation, Different label provenances require separate reporting]
sources:
  - {url: 'https://pubmedqa.github.io/', type: official, fields: [summary, data.size], checked_on: '2026-10-02'}
  - {url: 'https://github.com/pubmedqa/pubmedqa', type: repository, fields: [data.description, ground_truth.description, ground_truth.provenance], checked_on: '2026-10-02'}
  - {url: 'https://github.com/pubmedqa/pubmedqa/blob/master/evaluation.py', type: repository, fields: [evaluation.official_metrics], checked_on: '2026-10-02'}
  - {url: 'https://github.com/gzxiong/MIRAGE', type: repository, fields: [evaluation.protocol], checked_on: '2026-10-02'}
