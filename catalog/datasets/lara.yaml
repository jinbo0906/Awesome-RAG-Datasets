id: lara
name: LaRA
entity_type: dataset
status: source_checked
last_checked: '2026-10-02'
summary: Long-context QA benchmark comparing retrieval-augmented and full-context inference across books, papers and financial reports.
classification: {rag_role: rag_native, primary_category: text_rag, tasks: [long_context_qa, rag_robustness], modalities: [text], domains: [books, science, finance], languages: [en]}
data:
  corpus: provided
  queries: provided
  answers: provided
  description: Released 32k/128k context files and queries cover location, comparison, reasoning and hallucination tasks. Questions are constructed for the source context, rather than an unrestricted web corpus.
  size: 2,326 test cases across three context types and four QA tasks.
  format: JSON/JSONL
ground_truth:
  levels: [answer]
  provenance: mixed
  description: Human-authored seed QA guides GPT-4o generation, with sampled manual validation and iterative prompt refinement; this does not mean every pair is independently human-authored. Reference answers do not establish exhaustive supporting spans or optimal chunk boundaries.
  alternatives: not_documented
evaluation:
  official_metrics: [llm_judged_accuracy]
  protocol: Report context length, context type and task separately. Use the released RAG/full-context scripts with identical source texts and pin the judge model and prompt used by compute_score_llm.py.
  evaluator: https://github.com/Alibaba-NLP/LaRA/tree/main/evaluation
access: {official: 'https://github.com/Alibaba-NLP/LaRA', paper: 'https://proceedings.mlr.press/v267/li25dv.html', data: 'https://github.com/Alibaba-NLP/LaRA/tree/main/datasets', license: 'unknown; repository code is MIT, source texts retain upstream rights'}
use:
  best_for: [RAG versus long-context routing, Context-length and task-dependent retrieval analysis]
  caveats: [LLM-based grading depends on the judge and prompt, Answer correctness alone cannot validate a chunking boundary]
sources:
  - {url: 'https://arxiv.org/html/2502.09977#S3.SS3', type: paper, fields: [ground_truth.provenance, ground_truth.description], checked_on: '2026-10-02'}
  - {url: 'https://proceedings.mlr.press/v267/li25dv.html', type: paper, fields: [summary, data.size], checked_on: '2026-10-02'}
  - {url: 'https://github.com/Alibaba-NLP/LaRA', type: repository, fields: [data.description, ground_truth.description, evaluation.protocol, access.data, access.license], checked_on: '2026-10-02'}
  - {url: 'https://github.com/Alibaba-NLP/LaRA/blob/main/evaluation/compute_score_llm.py', type: repository, fields: [evaluation.official_metrics], checked_on: '2026-10-02'}
