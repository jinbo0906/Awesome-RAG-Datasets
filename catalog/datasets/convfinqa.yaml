summary: Conversational financial QA with linked numerical programs and answers for each turn.
classification: {rag_role: rag_convertible, primary_category: table_rag, tasks: [conversational_qa, text_table_reasoning], modalities: [text, table], domains: [finance], languages: [en]}
data:
