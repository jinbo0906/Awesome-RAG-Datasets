id: ragtruth
name: RAGTruth
entity_type: dataset
status: source_checked
last_checked: '2026-09-28'
summary: Human-annotated response-side hallucination spans over several RAG-style generation tasks.
classification:
  rag_role: auxiliary
  primary_category: text_rag
  tasks: [hallucination_detection, attribution]
  modalities: [text]
  domains: [multi-domain]
  languages: [en]
data:
  corpus: not_provided
  queries: provided
  answers: not_provided
  description: >-
    The release pairs source_info.jsonl with response.jsonl; each source elicits six model responses.
    The official repository reports 17,790 generated responses across QA, summarization and data-to-text.
    A generated response is a model output, not a gold answer.
  format: JSONL
ground_truth:
  levels: [response_span]
  provenance: human
  description: >-
    Annotators mark start/end offsets of unsupported spans in model responses, with label type and
    metadata. These response offsets are not source-evidence coordinates or retrieval qrels.
  alternatives: not_documented
evaluation:
  official_metrics: []
  protocol: >-
    Join responses to source_info by source_id, preserve train/test split and annotation version,
    and score hallucination detection separately from answer correctness or retrieval.
access:
  official: 'https://github.com/ParticleMedia/RAGTruth'
  paper: 'https://arxiv.org/abs/2401.00396'
  license: unknown
use:
  best_for: [Token- or span-level hallucination detection, Diagnosing unsupported claims]
  caveats: [Not an end-to-end retrieval benchmark, Does not supply a human gold answer for every generated response]
sources:
  - {url: 'https://github.com/ParticleMedia/RAGTruth', type: repository, fields: [summary, data.description, ground_truth.description, evaluation.protocol], checked_on: '2026-09-28'}
