id: medmcqa
name: MedMCQA
entity_type: dataset
status: source_checked
last_checked: '2026-10-02'
summary: Indian medical entrance-exam multiple-choice QA with explanations, subjects and topic metadata, used as a component of MIRAGE.
classification: {rag_role: rag_convertible, primary_category: text_rag, tasks: [single_hop_qa], modalities: [text], domains: [medicine], languages: [en]}
data:
  corpus: not_provided
  queries: provided
  answers: provided
  description: Question records contain four options, a correct option, explanations and subject/topic fields. A fixed medical retrieval corpus must be supplied for RAG; an explanation is not a source document.
  format: JSON
ground_truth:
  levels: [answer]
  provenance: human
  description: Correct-option labels and explanatory text do not supply source-document relevance or supporting-span coordinates.
  alternatives: not_documented
evaluation:
  official_metrics: [accuracy]
  protocol: Use upstream split labels as documented; MIRAGE uses 4,183 development questions rather than the native held-out test set. Report the RAG corpus and question-only retrieval configuration.
access: {official: 'https://medmcqa.github.io/', paper: 'https://proceedings.mlr.press/v174/pal22a.html', data: 'https://github.com/medmcqa/medmcqa', license: 'MIT in author repository; consult source-question terms'}
related_suites: [mirage]
use:
  best_for: [Medical multiple-choice generation with external retrieval, MIRAGE component comparisons]
  caveats: [Requires a separately specified retrieval corpus and evidence mapping, MIRAGE development evaluation must not be reported as native test performance]
sources:
  - {url: 'https://github.com/medmcqa/medmcqa', type: repository, fields: [summary, data.description, ground_truth.description, access.data], checked_on: '2026-10-02'}
  - {url: 'https://github.com/medmcqa/medmcqa/blob/main/LICENSE.md', type: repository, fields: [access.license], checked_on: '2026-10-02'}
  - {url: 'https://github.com/gzxiong/MIRAGE', type: repository, fields: [evaluation.official_metrics, evaluation.protocol], checked_on: '2026-10-02'}
