id: xvbench
name: XVBench
entity_type: dataset
status: source_checked
last_checked: '2026-11-01'
summary: Video-corpus RAG questions with explicit supporting clip filenames, targeting visual detail retention during iterative retrieval and reasoning.
classification:
  rag_role: rag_native
  primary_category: multimodal_rag
  tasks: [video_qa, multimodal_retrieval, long_context_qa]
  modalities: [text, video]
  domains: [instructional-video]
  languages: [en]
data:
  corpus: external
  queries: provided
  answers: provided
  description: VimRAG introduces a HowTo100M-derived evaluation set. The official release provides query, gt, video_name and reference clip filenames; videos must be obtained separately and split using the provided fixed-duration preprocessing script.
  size: The released test JSONL contains 497 questions; 138 reference multiple clips, but none of their listed reference sets spans multiple source-video IDs in the inspected release.
  splits: One public test split; VimRAG training data and its approximately 200k-item merged evaluation corpus are separate experimental assets.
  format: JSONL plus a video splitting shell script; external HowTo100M videos.
ground_truth:
  levels: [document, answer]
  provenance: synthetic
  description: gt contains the target answer and reference lists addressable supporting video clips. Here document denotes a clip, not an entire original video. Clip names and the default 60-second segmentation allow reconstruction, but do not provide minimal temporal intervals or exhaustive alternative evidence sets.
  alternatives: not_documented
evaluation:
  official_metrics: [model_judged_answer_accuracy]
  protocol: VimRAG Section 4.1 and Table 2 report binary model-judged answer correctness; Appendix B specifies Qwen3-Max and Appendix J the judge prompt. Record corpus composition and reconstruct exact clip naming before retrieval. Clip-reference analysis is possible, but no additional ranking metric is claimed as an official reported score.
access:
  official: 'https://huggingface.co/datasets/Alibaba-NLP/xvbench'
  paper: 'https://arxiv.org/abs/2602.12735'
  data: 'https://huggingface.co/datasets/Alibaba-NLP/xvbench/tree/main'
  license: CC-BY-4.0 for annotations; obtain source videos under HowTo100M and upstream video terms.
  gated: false
use:
  best_for: [Testing retention of supporting video clips in iterative RAG, Comparing visual-memory compression against answer correctness]
  caveats: [The cross-video benchmark label does not guarantee each question needs multiple distinct source videos, The full merged corpus in the paper is not the 497-row annotation release, Source-video retrieval and exact preprocessing are required, Supporting clip names are coarser than optimal temporal boundaries]
sources:
  - {url: 'https://arxiv.org/html/2602.12735', type: paper, fields: [summary, ground_truth.provenance, evaluation.official_metrics, evaluation.protocol, data.splits], checked_on: '2026-11-01'}
  - {url: 'https://huggingface.co/datasets/Alibaba-NLP/xvbench', type: dataset_card, fields: [data.description, data.size, data.splits, data.format, access.license, access.gated, ground_truth.description, use.caveats], checked_on: '2026-11-01'}
  - {url: 'https://huggingface.co/datasets/Alibaba-NLP/xvbench/blob/main/xvbench.jsonl', type: official, fields: [data.size, ground_truth.levels, use.caveats], checked_on: '2026-11-01'}
  - {url: 'https://huggingface.co/datasets/Alibaba-NLP/xvbench/blob/main/split_video.sh', type: official, fields: [ground_truth.description, evaluation.protocol], checked_on: '2026-11-01'}
