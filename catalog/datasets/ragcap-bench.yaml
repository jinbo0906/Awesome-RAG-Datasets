id: ragcap-bench
name: RAGCap-Bench
entity_type: dataset
status: source_checked
last_checked: '2026-11-18'
summary: Multiple-choice process diagnostics for planning, evidence extraction, grounded reasoning and noise robustness in search agents.
classification: {rag_role: auxiliary, primary_category: text_rag, tasks: [agentic_search, rag_robustness], modalities: [text], domains: [open-web-qa], languages: [en, zh]}
data:
  corpus: not_provided
  queries: provided
  answers: provided
  description: AACL 2026 Long paper turns intermediate execution outputs from deep-research workflows into controlled choice tasks. The release supplies questions with context/options and prompts for six sub-capabilities.
  size: 255 released items in six task CSVs. Planning divergence/convergence 25/51, evidence extraction 69, grounded reasoning 53, noise abstention/reliability 37/20.
  splits: One evaluation collection partitioned by sub-capability. Keep prompt conditions separate.
  format: CSV with multiple-choice items and Python prompt definitions
ground_truth:
  levels: [answer]
  provenance: mixed
  description: Correct choices are curated from intermediate traces and error-guided or template-based alternatives. The localized choice task examines one aspect of an agent step with context supplied.
  alternatives: not_documented
evaluation:
  official_metrics: [exact_match, option_F1]
  protocol: Parse selected options and score option-set exact match and macro F1 by task under the specified bare or informative prompt. The separate WebThinker experiments report downstream pass@1 on BrowseComp and other web QA benchmarks.
access:
  official: https://github.com/jingru-lin/RAGCap-Bench
  paper: https://aclanthology.org/2026.aacl-long.245/
  data: https://github.com/jingru-lin/RAGCap-Bench/tree/99ed0d915cb2816a1182ef1a2a85a45d6fb6afde/data
  license: unknown
  gated: false
use:
  best_for: [Probing which intermediate tasks fail before end-to-end runs, Comparing model capability under matched supplied contexts]
  caveats: [Multiple-choice scores do not directly measure free-form planning or tool execution, Logs serve as construction inputs without a released open retrieval index, The repository publishes prompt definitions without a standalone scorer]
sources:
  - {url: 'https://aclanthology.org/2026.aacl-long.245.pdf', type: paper, fields: [summary, classification, data.description, ground_truth, evaluation.official_metrics, evaluation.protocol, use], checked_on: '2026-11-18'}
  - {url: 'https://github.com/jingru-lin/RAGCap-Bench/tree/99ed0d915cb2816a1182ef1a2a85a45d6fb6afde/data', type: repository, fields: [data.size, data.splits, data.format, access.data], checked_on: '2026-11-18'}
  - {url: 'https://github.com/jingru-lin/RAGCap-Bench/tree/main/prompts', type: repository, fields: [evaluation.protocol], checked_on: '2026-11-18'}
