id: a-okvqa
name: A-OKVQA
entity_type: dataset
status: source_checked
last_checked: '2026-10-02'
summary: Knowledge-intensive visual questions with direct answers, multiple-choice labels and human rationales.
classification:
  rag_role: rag_convertible
  primary_category: multimodal_rag
  tasks: [visual_qa, multimodal_retrieval]
  modalities: [text, image]
  domains: [commonsense, general-knowledge]
  languages: [en]
data:
  corpus: not_provided
  queries: provided
  answers: provided
  description: >-
    Crowdsourced questions over COCO 2017 images require world knowledge and scene reasoning.
    The official v1.0 package includes answer choices, direct answers and rationales; it does not supply a fixed external knowledge pool.
  size: Approximately 25,000 questions.
  splits: Train, validation and test; held-out test predictions use the official leaderboard.
  format: QA JSON; COCO 2017 images downloaded separately.
ground_truth:
  levels: [answer]
  provenance: human
  description: >-
    Correct choices, direct-answer variants and free-text rationales supervise answering and explanation.
    A rationale is not a retrieved passage identifier or a human-verified external citation.
  alternatives: explicit
evaluation:
  official_metrics: [multiple_choice_accuracy, direct_answer_VQA_accuracy]
  protocol: >-
    Report multiple-choice and direct-answer scores separately. Apply the official direct-answer
    eligibility filter and matching rules; disclose knowledge retrieval, corpus versions and rationale-derived supervision.
  evaluator: 'https://github.com/allenai/aokvqa/blob/main/evaluation/eval_predictions.py'
access:
  official: 'https://github.com/allenai/aokvqa'
  paper: 'https://arxiv.org/abs/2206.01718'
  data: 'https://prior-datasets.s3.us-east-2.amazonaws.com/aokvqa/aokvqa_v1p0.tar.gz'
  license: Apache-2.0 for the official repository; COCO images retain separate upstream terms.
use:
  best_for: [Knowledge retrieval combined with scene reasoning, Comparing direct answers and multiple-choice reasoning]
  caveats: [Human rationales are not retrieval relevance gold, The dataset is a distinct successor with no shared OK-VQA question-image pairs]
sources:
  - {url: 'https://github.com/allenai/aokvqa', type: repository, fields: [summary, data.description, data.size, data.splits, ground_truth.description, evaluation.protocol, access.data], checked_on: '2026-10-02'}
  - {url: 'https://github.com/allenai/aokvqa/blob/main/evaluation/eval_predictions.py', type: repository, fields: [evaluation.official_metrics], checked_on: '2026-10-02'}
  - {url: 'https://github.com/allenai/aokvqa/blob/main/LICENSE', type: repository, fields: [access.license], checked_on: '2026-10-02'}
  - {url: 'https://okvqa.allenai.org/download.html', type: official, fields: [use.caveats], checked_on: '2026-10-02'}
