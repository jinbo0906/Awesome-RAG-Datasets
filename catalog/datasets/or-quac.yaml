id: or-quac
name: OR-QuAC
entity_type: dataset
status: source_checked
last_checked: '2026-10-02'
summary: QuAC conversations adapted to open retrieval with CANARD question rewrites and a Wikipedia passage collection.
classification: {rag_role: rag_native, primary_category: text_rag, tasks: [conversational_qa, query_rewriting, evidence_retrieval], modalities: [text], domains: [wikipedia], languages: [en]}
data:
  corpus: provided
  queries: provided
  answers: provided
  description: Author resources provide the passage collection, derived qrels, train/dev/test examples and QuAC-format dev/test references. The dataset aggregates QuAC dialogue, CANARD standalone rewrites and Wikipedia passages.
ground_truth:
  levels: [paragraph, span, answer]
  provenance: mixed
  description: Answer spans originate in human QuAC annotations; passage qrels are derived from those gold contexts and are explicitly partial, because other passages may also answer a question.
  alternatives: explicit
evaluation:
  official_metrics: [answer_f1, HEQ-Q, HEQ-D, MRR, retrieval_recall]
  protocol: Preserve original dialogue histories and QuAC answer references, and evaluate retrieval separately from reader quality. Do not assume preprocessed dev/test evidence fields always include gold passages.
access: {official: 'https://github.com/prdwb/orconvqa-release', paper: 'https://ciir-publications.cs.umass.edu/getpdf.php?id=1386', license: CC-BY-SA-4.0}
use:
  best_for: [Conversational retrieval and reader pipelines, Comparing standalone rewrites with history-aware retrieval]
  caveats: [Derived passage relevance judgments are incomplete, Retrieval-independent gold-context QA does not measure end-to-end performance]
sources:
  - {url: 'https://github.com/prdwb/orconvqa-release', type: repository, fields: [summary, data.description, ground_truth.description, evaluation.protocol, access.license], checked_on: '2026-10-02'}
  - {url: 'https://ciir-publications.cs.umass.edu/getpdf.php?id=1386', type: paper, fields: [evaluation.official_metrics], checked_on: '2026-10-02'}
  - {url: 'https://github.com/prdwb/orconvqa-release/blob/master/scorer.py', type: repository, fields: [evaluation.official_metrics], checked_on: '2026-10-02'}
  - {url: 'https://github.com/prdwb/orconvqa-release/blob/master/train_pipeline.py', type: repository, fields: [evaluation.official_metrics], checked_on: '2026-10-02'}
