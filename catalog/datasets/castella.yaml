id: castella
name: CASTELLA
entity_type: dataset
status: source_checked
last_checked: '2026-11-18'
summary: Human-annotated audio moment retrieval with sound descriptions and potentially multiple time intervals in long recordings.
classification: {rag_role: auxiliary, primary_category: multimodal_rag, tasks: [evidence_retrieval, multimodal_retrieval], modalities: [audio, text], domains: [acoustic-events], languages: [en, ja]}
data:
  corpus: external
  queries: provided
  answers: not_provided
  description: Given a recording and a local description, find matching moments within 1–5 minutes of audio. The repository provides English and Japanese annotations, source IDs, download tools and links to extracted features.
  size: 1,862 recordings (1,009 train, 213 validation and 640 test). Pinned EN and JA JSON each store 2,182/352/1,347 local caption rows and 6,157/973/4,175 time pairs. The num_moments totals (2,208/357/1,361) differ from row counts.
  splits: Native train, validation and test. The paper's localization experiment excludes 242 recordings without local captions. Challenge adaptations may use different protocols.
  format: JSON with YouTube IDs, local captions and timestamp pairs, plus separately hosted features
ground_truth:
  levels: [time_interval]
  provenance: human
  description: Each local caption has human-annotated start and end seconds at one-second resolution. Multiple intervals can match a single caption, and intervals may include nearby context.
  alternatives: explicit
evaluation:
  official_metrics: [Recall1_at_tIoU_0.5, Recall1_at_tIoU_0.7, mAP_at_tIoU_0.5, mAP_at_tIoU_0.75, mean_mAP_over_tIoU_thresholds]
  protocol: Report within-recording localization using the paper's temporal IoU thresholds. Document split and feature versions as well as which source waveforms were available. QA generation requires a separate adaptation.
  evaluator: https://github.com/line/CASTELLA
access:
  official: https://github.com/line/CASTELLA
  paper: https://arxiv.org/abs/2511.15131
  data: https://github.com/line/CASTELLA/tree/9b592efe898e6452631dcea001033009762fe36a/json
  license: CC-BY-4.0 for the annotation release. Source audio availability and terms vary.
  gated: false
use:
  best_for: [Testing acoustic evidence localization independently of speech transcription, Evaluating retrieval of repeated events within a long audio recording]
  caveats: [The corpus must be obtained separately for waveform evaluation, Localization labels support a component evaluation without QA reference answers, One-second annotation resolution limits precision at short durations]
sources:
  - {url: 'https://research.lycorp.co.jp/en/publications/2663', type: official, fields: [summary, classification, data.size], checked_on: '2026-11-18'}
  - {url: 'https://arxiv.org/html/2511.15131v2', type: paper, fields: [data.description, data.splits, ground_truth, evaluation.official_metrics, evaluation.protocol, use], checked_on: '2026-11-18'}
  - {url: 'https://github.com/line/CASTELLA/tree/9b592efe898e6452631dcea001033009762fe36a/json', type: repository, fields: [data.size, data.format, access.data, ground_truth.description], checked_on: '2026-11-18'}
  - {url: 'https://github.com/line/CASTELLA', type: repository, fields: [access.license, evaluation.evaluator], checked_on: '2026-11-18'}
