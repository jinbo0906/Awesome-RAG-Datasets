    type: paper
    fields: [summary, classification.tasks, ground_truth]
    checked_on: '2026-11-20'
  - url: 'https://arxiv.org/html/2502.15543v4#S5'
    type: paper
    fields: [evaluation.official_metrics, evaluation.protocol]
    checked_on: '2026-11-20'
