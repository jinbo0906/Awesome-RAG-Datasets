id: deepresearch-bench-ii
name: DeepResearch Bench II
entity_type: dataset
status: source_checked
last_checked: '2026-11-01'
summary: Expert-report-grounded rubrics measuring information recall, analysis and presentation in deep-research reports.
classification:
  rag_role: rag_native
  primary_category: text_rag
  tasks: [agentic_search, long_form_qa, attribution]
  modalities: [text]
  domains: [general, professional-research]
  languages: [en, zh]
data:
  corpus: external
  queries: provided
  answers: provided
  description: tasks_and_rubrics.jsonl supplies prompts and content-bearing assessment rubrics derived from expert articles through LLM extraction, revision and human/expert review. Agents research the web and write reports; reference articles and forbidden-reference rules are evaluation material, not oracle context for the agent.
  size: 132 released tasks across 22 domains, with 66 English and 66 Chinese tasks and 9,430 rubrics; the October 2026 leaderboard excludes tasks 112 and 114, leaving 130 eligible tasks.
  splits: Released evaluation set; retain all 132 records for archival accounting and report the exact scored task IDs, valid-result count and exclusions.
  format: JSONL tasks/rubrics; evaluated Markdown or DOCX reports are parsed to text by the current pipeline.
ground_truth:
  levels: [rubric]
  provenance: mixed
  description: Released binary content rubrics encode factual or inferential output requirements, not source-coordinate qrels or a unique reference report. The current judge uses 1 for supported satisfaction, 0 for absence, and -1 for reliance on blocked references; evidence strings locate text in the generated report, not original-source evidence gold.
  alternatives: not_documented
evaluation:
  official_metrics: [total, inforecall, analysis, presentation, blocked_rate]
  protocol: The aggregator measures the fraction of rubric items scored 1 and separately the blocked-reference fraction, then averages available task results. Fix judged task IDs, denominator and judge branch; the official evaluator migrated in August 2026 and October scoring excludes two tasks. Do not compare 132-task historical scores with 130-task current scores or treat rubric success as document recall.
  evaluator: 'https://github.com/imlrz/DeepResearch-Bench-II/blob/main/aggregate_scores.py'
access:
  official: 'https://github.com/imlrz/DeepResearch-Bench-II'
  paper: 'https://arxiv.org/abs/2601.08536'
  data: 'https://github.com/imlrz/DeepResearch-Bench-II/blob/main/tasks_and_rubrics.jsonl'
  license: Per-task data terms follow DATA_LICENSE and each record's source license; 129 tasks CC-BY-4.0, two CC-BY-NC-4.0 and one CC0, not the Apache-2.0 code license.
use:
  best_for: [Diagnosing missing information versus weak analysis or presentation, Designing independently verifiable fine-grained report rubrics]
  caveats: [Source-article leakage and blocked-reference use must be assessed separately from writing quality, Current repository parsing ignores embedded report images; support for file formats is not multimodal retrieval gold, License and score eligibility vary by task; preserve per-task metadata rather than assigning a blanket license or denominator]
sources:
  - {url: 'https://arxiv.org/html/2601.08536', type: paper, fields: [name, summary, data.description, data.size, ground_truth.provenance, use.best_for], checked_on: '2026-11-01'}
  - {url: 'https://github.com/imlrz/DeepResearch-Bench-II', type: repository, fields: [data.splits, data.format, ground_truth.description, evaluation.protocol, use.caveats], checked_on: '2026-11-01'}
  - {url: 'https://github.com/imlrz/DeepResearch-Bench-II/blob/main/aggregate_scores.py', type: repository, fields: [evaluation.official_metrics, evaluation.protocol], checked_on: '2026-11-01'}
  - {url: 'https://github.com/imlrz/DeepResearch-Bench-II/blob/main/DATA_LICENSE', type: repository, fields: [access.license], checked_on: '2026-11-01'}
  - {url: 'https://github.com/imlrz/DeepResearch-Bench-II/blob/main/tasks_and_rubrics.jsonl', type: repository, fields: [data.size, ground_truth.levels, ground_truth.description], checked_on: '2026-11-01'}
