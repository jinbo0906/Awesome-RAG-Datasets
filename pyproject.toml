[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "awesome-rag-datasets"
version = "0.1.0"
description = "A source-audited catalog of RAG datasets and benchmark suites"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "jsonschema>=4.23,<5", "Jinja2>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/awesome_rag_datasets"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

